<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC De Kampioenen Quiz</title>

    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stijl.css">
</head>
<body>

    <div id="game-over-overlay">
        <h2 id="game-over-subtitle">De slimste kampioen is voor nu:</h2>
        <h1 id="game-over-text">WINNAAR!</h1>
    </div>

    <h1>F.C. De Kampioenen Quiz</h1>

    <div id="setup-screen" class="visible">
        <h2>Spelers Instellen</h2>
        <div class="setup-input-row">
            <label for="num-players">Aantal spelers (1-10):</label>
            <input type="number" id="num-players" min="1" max="10" value="4" onchange="updatePlayerInputs()">
        </div>
        <div id="player-name-inputs"></div>
        <button id="start-quiz-btn" onclick="initializeGame(1)">Start Quiz</button>
    </div>

    <div id="player-container" style="display: none;"></div>

    <div id="game-board" style="display: none;">
        <h2 id="round-title"></h2> <p id="question-counter"></p>
        <p id="question-id"></p>

        <div id="question-area">
            <p id="puzzle-ids"></p>
            <p id="question-text" style="display: none;">Vraagtekst</p>

            <div id="puzzle-display-area" style="display: none;">
                <div id="puzzle-answers-container"></div>
                <div id="puzzle-clues-container"></div>
            </div>

            <div id="opendeur-display-area" style="display: none;">
                <h3 id="opendeur-subject"></h3>
                <div id="opendeur-keywords-container"></div>
            </div>

            <div id="geheugen-display-area" style="display: none;">
                <ul id="geheugen-board"></ul>
            </div>

            <!-- DE NIEUWE STIJL VOOR RONDE 5 -->
            <div id="beeld-display-area" style="display: none; width: 100%; flex-direction: column; align-items: center;">
                
                <!-- Videomuur -->
                <div id="beeld-grid" style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; width: 90%; margin-top: 20px;"></div>
                
                <!-- Video Speler -->
                <div id="beeld-player-container" style="display: none; width: 100%; max-width: 1000px; margin: 0 auto;">
                    <video id="beeld-video-player" style="width: 100%; border: 4px solid var(--kamp-geel); border-radius: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.9); background: #000;"></video>
                </div>
                
                <!-- Trefwoorden (Verschijnen pas na de video) -->
                <div id="beeld-tasks-container" style="display: none; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; width: 95%; margin-top: 20px;"></div>
            </div>

            <div id="finale-display-area" style="display: none;">
                <h3 id="finale-subject"></h3>
                <div id="finale-keywords-container"></div>
            </div>

            <div class="controls-r2-input-group">
                <input type="text" id="answer-input" placeholder="Typ hier het antwoord in..." style="display: none;">
                <button id="check-answer" style="display: none;">Check Antwoord</button>
            </div>
        </div>

        <div class="controls" style="display: none;">
            <button id="start-round-1">START RONDE 1</button>
            <button id="start-round-2">Start Ronde 2</button>
            <button id="start-round-3">Start Ronde 3</button>
            <button id="start-round-4">Start Ronde 4</button>
            <button id="start-round-5">Start Ronde 5</button>
            <button id="start-finale">START DE FINALE</button>
        </div>
    </div>

    <!-- INLADEN VAN DATA SCRIPTS -->
    <script src="quizdata_r1.js"></script>
    <script src="quizdata_r2.js"></script>
    <script src="quizdata_r3.js"></script>
    <script src="quizdata_r4.js"></script>
    <script src="quizdata_r5.js"></script>
    <script src="quizdata_r6.js"></script>
    <script src="quizdata_loader.js"></script>

    <script>
    const channel = new BroadcastChannel('trivial_time_channel');
    let quizData = {};

    const SIMILARITY_THRESHOLD = 0.80;
    const R1_BONUS_SECONDS = 20; 
    const R2_R3_R4_BONUS_SECONDS = 40; 
    const R5_OPPONENT_PENALTY_SECONDS = 20; 
    
    function levenshteinDistance(s1, s2) {
        s1 = s1.toLowerCase().trim().replace(/\s/g, ""); s2 = s2.toLowerCase().trim().replace(/\s/g, "");
        const costs = new Array();
        for (let i = 0; i <= s1.length; i++) {
            let lastValue = i;
            for (let j = 0; j <= s2.length; j++) {
                if (i === 0) costs[j] = j;
                else if (j > 0) {
                    let newValue = costs[j - 1];
                    if (s1.charAt(i - 1) !== s2.charAt(j - 1)) newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                    costs[j - 1] = lastValue; lastValue = newValue;
                }
            }
            if (i > 0) costs[s2.length] = lastValue;
        }
        return costs[s2.length];
    }
    
    function stringSimilarity(s1, s2) {
        if (s1.length === 0 && s2.length === 0) return 1.0;
        const longer = s1.length > s2.length ? s1 : s2; const shorter = s1.length > s2.length ? s2 : s1;
        const longerLength = longer.length; if (longerLength === 0) return 1.0;
        return (longerLength - levenshteinDistance(longer, shorter)) / parseFloat(longerLength);
    }

    let players = [], isGameOver = false, finalists = [], activeFinalistIndex = 0, currentRound = 0, currentQuestionIndex = 0;
    let activePlayerIndex = 0, timerInterval = null, isTimerRunning = false, timerPlayerIndex = null, currentSetAttempts = [], currentQuestionAttempts = [];
    let startingPlayersThisRound = []; 
    let playedVideos = []; // Houdt bij welke fragmenten in R5 al gekozen zijn

    const setupScreen = document.getElementById('setup-screen'), playerNameInputs = document.getElementById('player-name-inputs');
    const numPlayersInput = document.getElementById('num-players'), playerContainer = document.getElementById('player-container');
    const gameBoard = document.getElementById('game-board'), roundTitle = document.getElementById('round-title');
    const questionText = document.getElementById('question-text'), questionCounter = document.getElementById('question-counter');
    const questionIdElement = document.getElementById('question-id'), puzzleIdsElement = document.getElementById('puzzle-ids');
    const inputAnswer = document.getElementById('answer-input'), btnCheckAnswer = document.getElementById('check-answer');
    
    const opendeurDisplayArea = document.getElementById('opendeur-display-area'), opendeurSubject = document.getElementById('opendeur-subject');
    const geheugenBoard = document.getElementById('geheugen-board');

    function showFinaleWinner(winnerPlayer) {
        stopTimer(); isGameOver = true;
        document.getElementById('game-over-text').textContent = winnerPlayer.name;
        document.getElementById('game-over-overlay').style.display = 'flex';
    }

    function showBonusFeedback(playerIndex, amount) {
        const playerCard = document.querySelector(`.player-card[data-player-index="${playerIndex}"]`); if (!playerCard) return;
        const feedbackEl = playerCard.querySelector('.bonus-feedback'); if (!feedbackEl) return;
        feedbackEl.style.transition = 'none'; feedbackEl.style.opacity = '0'; feedbackEl.style.transform = 'translate(-50%, -50%)'; 
        void feedbackEl.offsetWidth; 
        feedbackEl.textContent = `${amount > 0 ? '+' : ''}${amount}`;
        if (amount > 0) { feedbackEl.style.color = 'var(--correct-color)'; playerCard.classList.add('time-gain-flash'); } 
        else { feedbackEl.style.color = 'var(--wrong-color)'; playerCard.classList.add('time-loss-flash'); }
        setTimeout(() => { feedbackEl.style.transition = 'transform 1s ease-out, opacity 1s ease-out'; feedbackEl.style.opacity = '1'; feedbackEl.style.transform = 'translate(-50%, -150%)'; }, 50);
        setTimeout(() => { feedbackEl.style.opacity = '0'; feedbackEl.style.transform = 'translate(-50%, -50%)'; playerCard.classList.remove('time-gain-flash', 'time-loss-flash'); }, 2000); 
    }

    function updatePlayerInputs() {
        let num = parseInt(numPlayersInput.value); num = Math.max(1, Math.min(10, num)); numPlayersInput.value = num;
        playerNameInputs.innerHTML = "";
        for (let i = 0; i < num; i++) {
            const row = document.createElement('div'); row.className = 'setup-input-row';
            row.innerHTML = `<label>Speler ${i + 1}:</label><input type="text" id="player-name-${i}" placeholder="Naam speler ${i + 1}" value="${i < 4 ? 'Speler '+(i+1) : ''}">`;
            playerNameInputs.appendChild(row);
        }
    }

    function initializeGame(startRound = 1) {
        if (!window.ThemeManager) { alert("Systeemfout: ThemeManager is niet geladen."); return; }
        quizData = window.ThemeManager.getTheme('KAMPIOENEN');
        if (!quizData) { alert("Oeps! Het thema 'KAMPIOENEN' is niet gevonden."); return; }

        quizData.ronde1_pool = (quizData.ronde1_pool || []).map((q, i) => ({ ...q, id: i + 1 }));
        quizData.ronde2_answer_pool = (quizData.ronde2_answer_pool || []).map((q, i) => ({ ...q, id: i + 1 }));
        quizData.ronde3_openDeur = (quizData.ronde3_openDeur || []).map((q, i) => ({ 
            ...q, id: i + 1, keywords: (q.keywords || []).map(w => ({ word: w, found: false })) 
        }));
        quizData.ronde4_geheugen = (quizData.ronde4_geheugen || []).map((q, i) => ({ ...q, id: i + 1, found: false }));
        
        quizData.ronde5_beeld = (quizData.ronde5_beeld || []).map((q, i) => ({ 
            ...q, id: i + 1, 
            ans_seizoen: { word: q.vraag1_seizoen || "?", found: false, label: "Seizoen" }, 
            ans_aflevering: { word: q.vraag2_aflevering || "?", found: false, label: "Aflevering" }, 
            ans_zin: { word: q.vraag3_zinEind || "?", found: false, label: `Zin: "${q.vraag3_zinBegin || "..."}"` }, 
            ans_kw1: { word: (q.vraag4_keywords && q.vraag4_keywords[0]) ? q.vraag4_keywords[0] : "?", found: false, label: "Trefwoord 1" }, 
            ans_kw2: { word: (q.vraag4_keywords && q.vraag4_keywords[1]) ? q.vraag4_keywords[1] : "?", found: false, label: "Trefwoord 2" } 
        }));

        quizData.ronde6_finale = (quizData.ronde6_finale || []).map((q, i) => ({ 
            ...q, id: i + 1, keywords: (q.keywords || []).map(w => ({ word: w, found: false })) 
        }));

        players = [];
        const numPlayers = parseInt(numPlayersInput.value); 
        const inputElements = playerNameInputs.querySelectorAll('input[type="text"]');
        let allNamesValid = true;

        for (let i = 0; i < numPlayers; i++) {
            const name = inputElements[i] ? inputElements[i].value.trim() : '';
            if (i < 2 && !name) allNamesValid = false; 
            else if (name) players.push({ name: name, seconds: 60, originalIndex: i });
        }

        if (allNamesValid && players.length >= 2) {
            setupScreen.style.display = 'none'; 
            playerContainer.style.display = 'flex'; 
            gameBoard.style.display = 'block';
            activePlayerIndex = players[0].originalIndex; 
            renderPlayers(); 
            
            hideAllGameAreas();
            document.getElementById('question-text').style.display = 'block';
            document.getElementById('question-text').textContent = "Klaar voor de start! Wachten op de spelleider...";
        } else { alert("Minimaal 2 spelers nodig."); }
    }

    window.addEventListener('load', () => { updatePlayerInputs(); setupScreen.classList.add('visible'); });

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; }
        return array;
    }

    function getNextStartingPlayerIndex(round) {
        let eligiblePlayers = players.filter(p => p.seconds > 0 && !startingPlayersThisRound.includes(p.originalIndex));
        if (eligiblePlayers.length === 0) eligiblePlayers = players.filter(p => p.seconds > 0);
        if (eligiblePlayers.length === 0) return (players.sort((a, b) => a.seconds - b.seconds)[0]?.originalIndex || 0);
        eligiblePlayers.sort((a, b) => a.seconds - b.seconds);
        return eligiblePlayers[0].originalIndex;
    }

    function getNextPlayerForSet(currentIndex, attemptsArray) {
        let eligible = players.filter(p => p.seconds > 0 && !attemptsArray.includes(p.originalIndex));
        if (eligible.length === 0) return -1;
        eligible.sort((a, b) => a.seconds - b.seconds);
        return eligible[0].originalIndex; 
    }

    function renderPlayers() {
        playerContainer.innerHTML = "";
        const playersToShow = (currentRound === 6) ? finalists.map(f => f.player) : players;
        let syncData = [];

        playersToShow.forEach((player, index) => {
            const playerObj = (currentRound === 6) ? finalists[index].player : player;
            const originalIndex = playerObj.originalIndex !== undefined ? playerObj.originalIndex : index;
            
            const card = document.createElement('div'); card.className = 'player-card'; card.dataset.playerIndex = originalIndex;
            
            if (currentRound >= 2 && currentRound <= 5 && currentSetAttempts.includes(originalIndex)) {
                card.classList.add('attempted');
            } else if (originalIndex === activePlayerIndex) {
                card.classList.add('active');
            }
            
            if (currentRound === 6 && originalIndex === activePlayerIndex) card.classList.add('final-player');
            else if (currentRound === 6) card.classList.add('opponent-player');

            let timerButtonSymbol = '►', timerButtonClass = 'player-timer-btn';
            let isRunning = false;
            if (isTimerRunning && timerPlayerIndex === originalIndex) { 
                timerButtonSymbol = '❚❚'; timerButtonClass += ' running'; 
                isRunning = true;
            }
            
            let hasPlayed = (currentRound >= 2 && currentRound <= 5 && startingPlayersThisRound.includes(originalIndex));
            let playedIcon = hasPlayed ? '<span style="color:var(--correct-color); font-size:0.8em; margin-right:5px; text-shadow:none;">✔️</span>' : '';

            card.innerHTML = `<div class="player-name">${playedIcon}${player.name}</div><div class="player-seconds">${player.seconds}</div><button class="${timerButtonClass}" data-player-index="${originalIndex}" style="position: absolute; top: 5px; right: 5px; display:none;">${timerButtonSymbol}</button><div class="bonus-feedback"></div>`;
            playerContainer.appendChild(card);

            syncData.push({
                index: originalIndex, name: player.name, seconds: player.seconds,
                isActive: (originalIndex === activePlayerIndex), isRunning: isRunning, hasPlayed: hasPlayed
            });
        });

        channel.postMessage({ type: 'SYNC_PLAYERS', players: syncData });
    }
    
    function showFeedback(isCorrect) {
        const className = isCorrect ? 'correct-feedback' : 'wrong-feedback';
        inputAnswer.classList.remove('correct-feedback', 'wrong-feedback'); inputAnswer.classList.add(className); inputAnswer.focus();
        setTimeout(() => { inputAnswer.classList.remove(className); inputAnswer.focus(); }, 1500);
    }

    function startTimer(playerIndex) {
        document.body.classList.remove('timer-stopped');
        let player = players.find(p => p.originalIndex === playerIndex);
        if (!player || player.seconds <= 0 || isTimerRunning) return;
        
        isTimerRunning = true; timerPlayerIndex = playerIndex;
        
        // MAAK RONDES HELDER ZODRA TIMER START
        if (currentRound === 2) document.getElementById('puzzle-clues-container').classList.remove('blurred-board');
        if (currentRound === 3) opendeurSubject.classList.remove('blurred-subject');
        if (currentRound === 4) geheugenBoard.classList.remove('blurred-board');
        if (currentRound === 5) document.getElementById('beeld-tasks-container').classList.remove('blurred-board');
        if (currentRound === 6) document.getElementById('finale-subject').classList.remove('blurred-subject');
        
        inputAnswer.disabled = false; inputAnswer.focus();

        timerInterval = setInterval(() => {
            let p = players.find(x => x.originalIndex === timerPlayerIndex);
            p.seconds--;
            if (p.seconds <= 0) {
                p.seconds = 0; stopTimer();
                if (currentRound === 6) {
                    const winnerPlayer = finalists.map(f => f.player).find(w => w.originalIndex !== p.originalIndex);
                    if (winnerPlayer) showFinaleWinner(winnerPlayer);
                } else if (currentRound >= 2 && currentRound <= 5) {
                    pasDeBeurt();
                }
            }
            renderPlayers();
        }, 1000);
        renderPlayers();
    }

    function stopTimer() {
        document.body.classList.add('timer-stopped'); clearInterval(timerInterval);
        isTimerRunning = false; timerInterval = null; inputAnswer.disabled = true;
        
        if (currentRound === 2 && !document.getElementById('puzzle-clues-container').classList.contains('answers-shown')) {
            document.getElementById('puzzle-clues-container').classList.add('blurred-board');
        }
        if (currentRound === 4 && !geheugenBoard.classList.contains('answers-shown')) {
            geheugenBoard.classList.add('blurred-board');
        }
        if (currentRound === 5 && !document.getElementById('beeld-tasks-container').classList.contains('answers-shown')) {
            document.getElementById('beeld-tasks-container').classList.add('blurred-board');
        }
        if (currentRound === 6 && document.getElementById('btn-finale-next').style.display === 'none') {
            document.getElementById('finale-subject').classList.add('blurred-subject');
        }
        
        renderPlayers();
    }

    function toggleTimer(clickedIndex) {
        if (isGameOver) return;
        let player = players.find(p => p.originalIndex === clickedIndex);
        if (!player || player.seconds <= 0) return;
        if (currentRound >= 2 && currentRound <= 5 && currentSetAttempts.includes(clickedIndex)) return;

        activePlayerIndex = clickedIndex;
        if (currentRound === 6) activeFinalistIndex = finalists.findIndex(f => f.player.originalIndex === clickedIndex);

        if (!isTimerRunning) startTimer(clickedIndex);
        else if (timerPlayerIndex === clickedIndex) { stopTimer(); if(currentRound >= 2) pasDeBeurt(); }
        else { stopTimer(); startTimer(clickedIndex); }
    }

    function updateSeconds(playerIndex, amount) {
        let player = players.find(p => p.originalIndex === playerIndex); if (!player) return;
        player.seconds += amount; if (player.seconds < 0) player.seconds = 0; renderPlayers();
    }

    function pasDeBeurt() {
        const previousPlayerIndex = timerPlayerIndex; stopTimer();
        
        if (currentRound === 1) {
            let idx = players.findIndex(p => p.originalIndex === activePlayerIndex);
            activePlayerIndex = players[(idx + 1) % players.length].originalIndex;
            renderPlayers();
        } else if (currentRound >= 2 && currentRound <= 5) {
            if (previousPlayerIndex !== null && !currentSetAttempts.includes(previousPlayerIndex)) {
                currentSetAttempts.push(previousPlayerIndex);
            }
            
            const nextPlayer = getNextPlayerForSet(activePlayerIndex, currentSetAttempts);
            if (nextPlayer !== -1) { 
                // Er is nog iemand die mag raden!
                activePlayerIndex = nextPlayer; 
                renderPlayers();
                // AUTO START TIMER VOOR DE VOLGENDE!
                setTimeout(() => { startTimer(activePlayerIndex); }, 200); 
            } else {
                // Iedereen is geweest.
                renderPlayers();
                if (currentRound === 5) {
                    returnToVideoGrid();
                } else if (currentRound === 2) { showPuzzleAnswers(); }
                else if (currentRound === 3) { showOpenDeurAnswers(); }
                else if (currentRound === 4) { showMemoryAnswers(); }
            }
        } else if (currentRound === 6) {
            activeFinalistIndex = (activeFinalistIndex + 1) % finalists.length;
            activePlayerIndex = finalists[activeFinalistIndex].player.originalIndex;
            renderPlayers();
        }
    }

    function hideAllGameAreas() {
        document.querySelectorAll('#game-board > div[id$="-display-area"]').forEach(el => el.style.display = 'none');
        questionText.style.display = 'none'; questionIdElement.style.display = 'none'; puzzleIdsElement.style.display = 'none';
        inputAnswer.style.display = 'none'; btnCheckAnswer.style.display = 'none'; questionCounter.style.display = 'none';
        
        const videoPlayer = document.getElementById('beeld-video-player');
        if (videoPlayer) { videoPlayer.pause(); videoPlayer.src = ""; }
    }

    // --- RONDE 1 ---
    let activeRound1Questions = [];
    function startGameR1() {
        currentRound = 1; currentQuestionIndex = 0; roundTitle.textContent = "Ronde 1: Algemene Kennis"; 
        activeRound1Questions = shuffleArray([...quizData.ronde1_pool]).slice(0, 12);
        hideAllGameAreas(); questionText.style.display = 'block'; questionCounter.style.display = 'block';
        stopTimer(); displayQuestionR1(); 
    }
    function displayQuestionR1() {
        if (currentQuestionIndex < activeRound1Questions.length) {
            currentQuestionAttempts = []; const q = activeRound1Questions[currentQuestionIndex];
            questionText.textContent = q.q; 
            questionCounter.innerHTML = `Vraag ${currentQuestionIndex + 1} / ${activeRound1Questions.length}`;
            inputAnswer.value = ""; inputAnswer.focus(); timerPlayerIndex = activePlayerIndex; renderPlayers();
            channel.postMessage({ type: 'SYNC_QUESTION', round: 1, ids: [q.id] });
        } else {
            hideAllGameAreas(); questionText.style.display = 'block'; questionText.textContent = "Einde van Ronde 1.";
        }
    }
    function checkRound1Answer() {
        const q = activeRound1Questions[currentQuestionIndex]; const isCorrect = (stringSimilarity(q.a, inputAnswer.value) >= SIMILARITY_THRESHOLD);
        stopTimer(); inputAnswer.value = "";
        if (isCorrect) {
            showFeedback(true); updateSeconds(activePlayerIndex, R1_BONUS_SECONDS); showBonusFeedback(activePlayerIndex, R1_BONUS_SECONDS);
            setTimeout(() => { currentQuestionIndex++; displayQuestionR1(); }, 2000);
        } else {
            showFeedback(false); if (!currentQuestionAttempts.includes(activePlayerIndex)) currentQuestionAttempts.push(activePlayerIndex);
            let nextFound = false; let currentIdx = players.findIndex(p => p.originalIndex === activePlayerIndex);
            for (let i = 1; i <= players.length; i++) {
                let candidate = players[(currentIdx + i) % players.length];
                if (!currentQuestionAttempts.includes(candidate.originalIndex) && candidate.seconds > 0) { activePlayerIndex = candidate.originalIndex; nextFound = true; break; }
            }
            if (nextFound) {
                questionText.textContent = `${players.find(p => p.originalIndex === activePlayerIndex).name} is aan de beurt.`;
                setTimeout(() => { questionText.textContent = q.q; renderPlayers(); inputAnswer.focus(); }, 1500);
            } else {
                questionText.textContent = `Niemand wist het. Antwoord: ${q.a}`;
                setTimeout(() => { currentQuestionIndex++; activePlayerIndex = players[(players.findIndex(p => p.originalIndex === activePlayerIndex) + 1) % players.length].originalIndex; displayQuestionR1(); 
                }, 3000);
            }
        }
    }

    // --- RONDE 2 ---
    let activeRound2Puzzles = [], currentPuzzleSet = null, currentR2SetCount = 0;
    function setupRound2() {
        currentRound = 2; currentR2SetCount = 0; startingPlayersThisRound = []; activePlayerIndex = getNextStartingPlayerIndex(2); roundTitle.textContent = `Ronde 2: De Puzzel`; 
        const fullPool = shuffleArray([...quizData.ronde2_answer_pool]); activeRound2Puzzles = [];
        for (let i = 0; i < players.length; i++) { activeRound2Puzzles.push(fullPool.slice(i * 3, (i + 1) * 3).map((p, j) => ({ ...p, found: false, color: `color-${(j % 3) + 1}`, clues: p.clues.map(c => ({ text: c, color: `color-${(j % 3) + 1}` })) }))); }
        hideAllGameAreas(); document.getElementById('puzzle-display-area').style.display = 'flex';
        questionText.style.display = 'block'; questionCounter.style.display = 'block'; loadNewPuzzle();
    }
    function loadNewPuzzle() {
        if (currentR2SetCount >= players.length) { hideAllGameAreas(); questionText.style.display = 'block'; questionText.textContent = "Einde van Ronde 2."; return; }
        activePlayerIndex = getNextStartingPlayerIndex(2); currentSetAttempts = []; currentPuzzleSet = activeRound2Puzzles[currentR2SetCount];
        startingPlayersThisRound.push(activePlayerIndex); 
        
        questionCounter.innerHTML = `Puzzel ${currentR2SetCount + 1} / ${players.length}`; 
        channel.postMessage({ type: 'SYNC_QUESTION', round: 2, ids: currentPuzzleSet.map(p => p.id) });
        
        let allClues = []; currentPuzzleSet.forEach(p => { p.clues.forEach(c => { allClues.push({ text: c.text, answer: p.answer, color: c.color, isFound: p.found }); }); }); shuffleArray(allClues);
        document.getElementById('puzzle-answers-container').innerHTML = currentPuzzleSet.map(p => `<div class="puzzle-answer ${p.found ? 'found '+p.color : ''}">${p.found ? p.answer : '???'}</div>`).join('');
        document.getElementById('puzzle-clues-container').innerHTML = allClues.map(c => `<div class="puzzle-clue ${c.isFound ? 'found '+c.color : ''}" data-answer="${c.answer.toLowerCase()}">${c.text}</div>`).join('');
        
        document.getElementById('puzzle-clues-container').classList.remove('answers-shown');
        document.getElementById('puzzle-clues-container').classList.add('blurred-board');
        
        inputAnswer.value = ''; stopTimer();
    }
    function checkRound2Answer() {
        const foundItem = currentPuzzleSet.find(p => !p.found && stringSimilarity(p.answer, inputAnswer.value) >= SIMILARITY_THRESHOLD);
        if (foundItem) {
            showFeedback(true); foundItem.found = true; updateSeconds(activePlayerIndex, R2_R3_R4_BONUS_SECONDS); showBonusFeedback(activePlayerIndex, R2_R3_R4_BONUS_SECONDS); currentSetAttempts = []; 
            document.getElementById('puzzle-answers-container').innerHTML = currentPuzzleSet.map(p => `<div class="puzzle-answer ${p.found ? 'found '+p.color : ''}">${p.found ? p.answer : '???'}</div>`).join('');
            Array.from(document.getElementById('puzzle-clues-container').children).forEach(el => { if(el.dataset.answer === foundItem.answer.toLowerCase()) el.className = `puzzle-clue found ${foundItem.color}`; });
            if (currentPuzzleSet.every(p => p.found)) { 
                document.getElementById('puzzle-clues-container').classList.add('answers-shown');
                document.getElementById('puzzle-clues-container').classList.remove('blurred-board');
                stopTimer(); currentSetAttempts = players.map(p => p.originalIndex); activePlayerIndex = getNextStartingPlayerIndex(2); 
            } else { setTimeout(() => { if (!isTimerRunning) startTimer(activePlayerIndex); }, 50); }
        } else { 
            showFeedback(false); inputAnswer.value = ''; pasDeBeurt(); 
        }
        inputAnswer.value = '';
    }
    function showPuzzleAnswers() { 
        currentPuzzleSet.forEach(p => p.found = true); 
        document.getElementById('puzzle-clues-container').classList.add('answers-shown');
        document.getElementById('puzzle-clues-container').classList.remove('blurred-board');
        checkRound2Answer(); 
    }

    // --- RONDE 3 ---
    let activeOpenDeurQuestions = [], currentOpenDeurIndex = 0;
    function setupRound3() {
        currentRound = 3; currentOpenDeurIndex = 0; startingPlayersThisRound = []; activePlayerIndex = getNextStartingPlayerIndex(3); roundTitle.textContent = `Ronde 3: Open Deur`; 
        activeOpenDeurQuestions = shuffleArray([...quizData.ronde3_openDeur]).slice(0, players.length);
        hideAllGameAreas(); opendeurDisplayArea.style.display = 'block'; questionText.style.display = 'block'; questionCounter.style.display = 'block'; loadOpenDeur();
    }
    function loadOpenDeur() {
        if (currentOpenDeurIndex >= players.length) { hideAllGameAreas(); questionText.style.display = 'block'; questionText.textContent = "Einde van Ronde 3."; return; }
        activePlayerIndex = getNextStartingPlayerIndex(3); currentSetAttempts = []; let activeOD = activeOpenDeurQuestions[currentOpenDeurIndex];
        startingPlayersThisRound.push(activePlayerIndex); 
        
        questionCounter.innerHTML = `Vraag ${currentOpenDeurIndex + 1} / ${players.length}`; opendeurSubject.textContent = activeOD.subject; opendeurSubject.classList.add('blurred-subject'); 
        channel.postMessage({ type: 'SYNC_QUESTION', round: 3, ids: [activeOD.id] });
        document.getElementById('opendeur-keywords-container').innerHTML = activeOD.keywords.map(k => `<div class="opendeur-keyword ${k.found ? 'found' : ''}">${k.found ? k.word : '???'}</div>`).join('');
        stopTimer(); inputAnswer.value = "";
    }
    function checkRound3Answer() {
        let activeOD = activeOpenDeurQuestions[currentOpenDeurIndex]; const foundItem = activeOD.keywords.find(k => !k.found && stringSimilarity(k.word, inputAnswer.value) >= SIMILARITY_THRESHOLD);
        if (foundItem) {
            showFeedback(true); foundItem.found = true; updateSeconds(activePlayerIndex, R2_R3_R4_BONUS_SECONDS); showBonusFeedback(activePlayerIndex, R2_R3_R4_BONUS_SECONDS); currentSetAttempts = []; opendeurSubject.classList.remove('blurred-subject');
            document.getElementById('opendeur-keywords-container').innerHTML = activeOD.keywords.map(k => `<div class="opendeur-keyword ${k.found ? 'found' : ''}">${k.found ? k.word : '???'}</div>`).join('');
            if (activeOD.keywords.every(k => k.found)) { stopTimer(); currentSetAttempts = players.map(p => p.originalIndex); activePlayerIndex = getNextStartingPlayerIndex(3); } else { setTimeout(() => { if (!isTimerRunning) startTimer(activePlayerIndex); }, 50); }
        } else { 
            showFeedback(false); inputAnswer.value = ''; pasDeBeurt(); 
        }
        inputAnswer.value = "";
    }
    function showOpenDeurAnswers() { activeOpenDeurQuestions[currentOpenDeurIndex].keywords.forEach(k => k.found = true); checkRound3Answer(); }

    // --- RONDE 4 ---
    let activeRound4Questions = [], currentMemoryList = 0;
    function setupRound4() {
        currentRound = 4; currentMemoryList = 0; startingPlayersThisRound = []; activePlayerIndex = getNextStartingPlayerIndex(4); roundTitle.textContent = `Ronde 4: Het Geheugen`; 
        quizData.ronde4_geheugen = shuffleArray(quizData.ronde4_geheugen);
        hideAllGameAreas(); geheugenDisplayArea.style.display = 'block'; questionText.style.display = 'block'; questionCounter.style.display = 'block'; loadMemoryQuestion();
    }
    function loadMemoryQuestion() {
        if (currentMemoryList >= players.length) { hideAllGameAreas(); questionText.style.display = 'block'; questionText.textContent = "Einde van Ronde 4!"; return; }
        activePlayerIndex = getNextStartingPlayerIndex(4); currentSetAttempts = []; activeRound4Questions = quizData.ronde4_geheugen.slice(currentMemoryList*6, (currentMemoryList+1)*6);
        startingPlayersThisRound.push(activePlayerIndex); 
        
        geheugenBoard.classList.remove('answers-shown'); geheugenBoard.classList.add('blurred-board'); questionCounter.innerHTML = `Beurt ${currentMemoryList + 1} / ${players.length}`; 
        channel.postMessage({ type: 'SYNC_QUESTION', round: 4, ids: activeRound4Questions.map(q => q.id) });
        const renderMem = () => geheugenBoard.innerHTML = activeRound4Questions.map((q,i) => `<li class="geheugen-item ${q.found ? 'found' : ''}"><span>${i+1}. <strong>${q.q1}</strong>...</span><span class="geheugen-antwoord">${q.found ? q.a : '...?'}</span></li>`).join(''); renderMem(); window.renderMemUI = renderMem;
        stopTimer(); inputAnswer.value = "";
    }
    function checkRound4Answer() {
        const foundItem = activeRound4Questions.find(q => !q.found && stringSimilarity(q.a, inputAnswer.value) >= SIMILARITY_THRESHOLD);
        if (foundItem) {
            showFeedback(true); foundItem.found = true; updateSeconds(activePlayerIndex, R2_R3_R4_BONUS_SECONDS); showBonusFeedback(activePlayerIndex, R2_R3_R4_BONUS_SECONDS); currentSetAttempts = []; window.renderMemUI();
            if (activeRound4Questions.every(q => q.found)) { stopTimer(); currentSetAttempts = players.map(p => p.originalIndex); activePlayerIndex = getNextStartingPlayerIndex(4); } else { setTimeout(() => { if (!isTimerRunning) startTimer(activePlayerIndex); }, 50); }
        } else { 
            showFeedback(false); inputAnswer.value = ''; pasDeBeurt(); 
        }
        inputAnswer.value = "";
    }
    function showMemoryAnswers() { activeRound4Questions.forEach(q => q.found = true); geheugenBoard.classList.add('answers-shown'); geheugenBoard.classList.remove('blurred-board'); checkRound4Answer(); }

    // --- RONDE 5 (Beeldronde) ---
    let activeBeeldQuestions = [], currentBeeldIndex = -1;
    function setupRound5() {
        currentRound = 5; currentBeeldIndex = -1; startingPlayersThisRound = []; playedVideos = [];
        activePlayerIndex = getNextStartingPlayerIndex(5); roundTitle.textContent = `Ronde 5: De Beeldronde`; 
        activeBeeldQuestions = shuffleArray([...quizData.ronde5_beeld]).slice(0, players.length);
        
        hideAllGameAreas(); 
        document.getElementById('beeld-display-area').style.display = 'flex'; 
        questionText.style.display = 'block'; 
        questionCounter.style.display = 'block'; 
        
        renderVideoGrid();
    }
    
    // DE NIEUWE VIDEOMUUR
    function renderVideoGrid() {
        if (playedVideos.length >= players.length) {
            hideAllGameAreas(); questionText.style.display = 'block'; questionText.textContent = "Einde van de Beeldronde!"; return;
        }

        activePlayerIndex = getNextStartingPlayerIndex(5); 
        questionText.textContent = "Kies een fragment!";
        questionCounter.innerHTML = `Aan de beurt: ${players.find(p=>p.originalIndex===activePlayerIndex).name}`;
        
        const grid = document.getElementById('beeld-grid');
        grid.innerHTML = activeRound5Questions.map((q, i) => {
            const isPlayed = playedVideos.includes(i);
            const opacity = isPlayed ? '0.3' : '1';
            const filter = isPlayed ? 'grayscale(100%)' : 'none';
            const bgImage = q.thumbnail ? `url('${q.thumbnail}')` : 'none';
            
            return `<div style="width: 200px; height: 150px; background-color: var(--bg-card); background-image: ${bgImage}; background-size: cover; background-position: center; border: 3px solid var(--kamp-geel); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.8em; font-weight: bold; opacity: ${opacity}; filter: ${filter}; flex-direction: column; text-shadow: 2px 2px 4px #000; box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
                ${isPlayed ? '❌' : 'Fragment ' + (i+1)}
            </div>`;
        }).join('');
        
        document.getElementById('beeld-grid').style.display = 'flex';
        document.getElementById('beeld-player-container').style.display = 'none';
        document.getElementById('beeld-tasks-container').style.display = 'none';
        
        stopTimer();
        channel.postMessage({ type: 'SYNC_R5_GRID', total: players.length, played: playedVideos });
    }

    // TERUG NAAR VIDEOMUUR
    function returnToVideoGrid() {
        if(currentBeeldIndex !== -1 && !playedVideos.includes(currentBeeldIndex)) {
            playedVideos.push(currentBeeldIndex);
        }
        currentBeeldIndex = -1;
        currentSetAttempts = [];
        renderVideoGrid();
    }

    // EEN VIDEO SPELEN
    function loadBeeldVraag(index) {
        currentBeeldIndex = index;
        currentSetAttempts = []; let q = activeRound5Questions[currentBeeldIndex];
        startingPlayersThisRound.push(activePlayerIndex); 
        
        questionText.textContent = "Kijk naar het fragment!";
        questionCounter.innerHTML = `Fragment ${currentBeeldIndex + 1}`; 
        
        document.getElementById('beeld-grid').style.display = 'none';
        document.getElementById('beeld-tasks-container').style.display = 'none';
        
        const videoContainer = document.getElementById('beeld-player-container');
        const videoPlayer = document.getElementById('beeld-video-player');
        
        videoContainer.style.display = 'block';
        videoPlayer.src = q.videoBron;
        
        // Zodra video eindigt: verberg en toon de vakjes (troebel)
        videoPlayer.onended = () => {
            videoContainer.style.display = 'none';
            renderBeeldUI();
            
            const tasksContainer = document.getElementById('beeld-tasks-container');
            tasksContainer.style.display = 'grid';
            tasksContainer.classList.add('blurred-board');
            tasksContainer.classList.remove('answers-shown');
            
            questionText.textContent = "Wat weet je nog?";
            
            // Nu pas de antwoorden sturen naar GM dashboard
            channel.postMessage({ type: 'SYNC_QUESTION', round: 5, ids: [q.id] });
        };

        stopTimer(); inputAnswer.value = "";
    }
    
    function renderBeeldUI() {
        let q = activeRound5Questions[currentBeeldIndex]; const container = document.getElementById('beeld-tasks-container');
        const tasks = [q.ans_seizoen, q.ans_aflevering, q.ans_zin, q.ans_kw1, q.ans_kw2];
        
        container.innerHTML = tasks.map(t => { 
            return `<div class="opendeur-keyword ${t.found ? 'found' : ''}" style="text-align: center; padding: 15px;">
                <div style="font-size:0.6em; color:var(--kamp-geel); margin-bottom:5px;">${t.label}</div>
                ${t.found ? t.word : '???'}
            </div>`; 
        }).join('');
    }
    
    function checkRound5Answer() {
        let q = activeRound5Questions[currentBeeldIndex]; const tasks = [q.ans_seizoen, q.ans_aflevering, q.ans_zin, q.ans_kw1, q.ans_kw2];
        const foundItem = tasks.find(t => !t.found && stringSimilarity(t.word, inputAnswer.value) >= SIMILARITY_THRESHOLD);
        if (foundItem) {
            showFeedback(true); foundItem.found = true; updateSeconds(activePlayerIndex, R2_R3_R4_BONUS_SECONDS); showBonusFeedback(activePlayerIndex, R2_R3_R4_BONUS_SECONDS); currentSetAttempts = []; renderBeeldUI();
            if (tasks.every(t => t.found)) { 
                document.getElementById('beeld-tasks-container').classList.add('answers-shown');
                document.getElementById('beeld-tasks-container').classList.remove('blurred-board');
                stopTimer(); currentSetAttempts = players.map(p => p.originalIndex); activePlayerIndex = getNextStartingPlayerIndex(5); 
                // Terug naar overzicht na kleine vertraging
                setTimeout(() => { returnToVideoGrid(); }, 3000);
            } else { setTimeout(() => { if (!isTimerRunning) startTimer(activePlayerIndex); }, 50); }
        } else { 
            showFeedback(false); inputAnswer.value = ''; pasDeBeurt(); 
        }
        inputAnswer.value = "";
    }
    function showBeeldAnswers() { 
        let q = activeRound5Questions[currentBeeldIndex]; [q.ans_seizoen, q.ans_aflevering, q.ans_zin, q.ans_kw1, q.ans_kw2].forEach(t => t.found = true); 
        document.getElementById('beeld-tasks-container').classList.add('answers-shown');
        document.getElementById('beeld-tasks-container').classList.remove('blurred-board');
        checkRound5Answer(); 
    }

    // --- RONDE 6 (Finale) ---
    let activeFinaleQuestions = [], currentFinaleQuestionIndex = 0;
    function setupFinale() {
        currentRound = 6; currentFinaleQuestionIndex = 0; roundTitle.textContent = "Ronde 6: De Finale"; 
        const topTwoPlayers = [...players].sort((a, b) => b.seconds - a.seconds).slice(0, 2); finalists = players.filter(p => topTwoPlayers.some(topP => topP.originalIndex === p.originalIndex)).map(p => ({ player: p, originalIndex: p.originalIndex }));
        activeFinaleQuestions = shuffleArray([...quizData.ronde6_finale]);
        const lowestScorePlayer = finalists.sort((a, b) => a.player.seconds - b.player.seconds)[0]; activePlayerIndex = lowestScorePlayer.player.originalIndex; activeFinalistIndex = finalists.findIndex(f => f.player.originalIndex === activePlayerIndex);
        hideAllGameAreas(); document.getElementById('finale-display-area').style.display = 'block'; questionText.style.display = 'block'; questionCounter.style.display = 'block'; loadFinaleQuestion();
    }
    function loadFinaleQuestion() {
        let q = activeFinaleQuestions[currentFinaleQuestionIndex]; document.getElementById('finale-subject').textContent = q.subject; document.getElementById('finale-subject').classList.add('blurred-subject');
        questionCounter.innerHTML = `FINALE / Aan de beurt: ${finalists[activeFinalistIndex].player.name}`;
        channel.postMessage({ type: 'SYNC_QUESTION', round: 6, ids: [q.id] });
        document.getElementById('finale-keywords-container').innerHTML = q.keywords.map(k => `<div class="finale-keyword" data-word="${k.word}">???</div>`).join('');
        stopTimer(); inputAnswer.value = '';
    }
    function checkFinaleAnswer() {
        let q = activeFinaleQuestions[currentFinaleQuestionIndex]; const foundItem = q.keywords.find(k => !k.found && stringSimilarity(k.word, inputAnswer.value) >= SIMILARITY_THRESHOLD);
        if (foundItem) {
            showFeedback(true); foundItem.found = true;
            const opponent = players.find(p => p.originalIndex !== activePlayerIndex && finalists.some(f => f.player.originalIndex === p.originalIndex));
            if (opponent) { showBonusFeedback(opponent.originalIndex, -R5_OPPONENT_PENALTY_SECONDS); updateSeconds(opponent.originalIndex, -R5_OPPONENT_PENALTY_SECONDS); }
            document.getElementById('finale-subject').classList.remove('blurred-subject');
            const kwEls = document.getElementById('finale-keywords-container').querySelectorAll('.finale-keyword'); const el = Array.from(kwEls).find(e => e.dataset.word === foundItem.word); if (el) { el.classList.add('found'); el.textContent = foundItem.word; }
            if (q.keywords.every(k => k.found)) { stopTimer(); } else { setTimeout(() => { if (!isTimerRunning && !isGameOver) startTimer(activePlayerIndex); }, 50); }
        } else { showFeedback(false); setTimeout(() => { if (!isTimerRunning) startTimer(activePlayerIndex); }, 50); }
        inputAnswer.value = '';
    }

    channel.onmessage = (event) => {
        if (!event.data) return;
        
        // ANTWOORD VAN DASHBOARD
        if (event.data.type === 'FILL_ANSWER') { inputAnswer.value = event.data.answer; if(currentRound==1) checkRound1Answer(); else if(currentRound==2) checkRound2Answer(); else if(currentRound==3) checkRound3Answer(); else if(currentRound==4) checkRound4Answer(); else if(currentRound==5) checkRound5Answer(); else if(currentRound==6) checkFinaleAnswer(); }
        
        // PAS/FOUT VAN DASHBOARD
        if (event.data.type === 'TRIGGER_FAIL') { 
            inputAnswer.value = "###FAIL###"; 
            if(currentRound==1) checkRound1Answer(); 
            else if(currentRound==2) { showFeedback(false); inputAnswer.value=''; pasDeBeurt(); }
            else if(currentRound==3) { showFeedback(false); inputAnswer.value=''; pasDeBeurt(); }
            else if(currentRound==4) { showFeedback(false); inputAnswer.value=''; pasDeBeurt(); }
            else if(currentRound==5) { showFeedback(false); inputAnswer.value=''; pasDeBeurt(); }
            else if(currentRound==6) checkFinaleAnswer(); 
        }
        
        if (event.data.type === 'TOGGLE_TIMER') toggleTimer(activePlayerIndex);
        if (event.data.type === 'SELECT_PLAYER') { activePlayerIndex = event.data.playerIndex; renderPlayers(); }
        
        if (event.data.type === 'START_ROUND') {
            if (event.data.round == 1) startGameR1();
            if (event.data.round == 2) setupRound2();
            if (event.data.round == 3) setupRound3();
            if (event.data.round == 4) setupRound4();
            if (event.data.round == 5) setupRound5();
            if (event.data.round == 6) setupFinale();
        }

        // R5 SPECIFIEK: START EEN GESELECTEERDE VIDEO
        if (event.data.type === 'SELECT_VIDEO') {
            if (currentRound === 5) loadBeeldVraag(event.data.index);
        }
        
        // R5 SPECIFIEK: SPEEL VIDEO AF
        if (event.data.type === 'PLAY_VIDEO') {
            if (currentRound === 5) {
                const vp = document.getElementById('beeld-video-player');
                if(vp) vp.play();
            }
        }

        if (event.data.type === 'NEXT_QUESTION') {
            if(currentRound==1) checkRound1Answer();
            if(currentRound==2) { currentR2SetCount++; loadNewPuzzle(); }
            if(currentRound==3) { currentOpenDeurIndex++; loadOpenDeur(); }
            if(currentRound==4) { currentMemoryList++; loadMemoryQuestion(); }
            if(currentRound==5) { returnToVideoGrid(); }
            if(currentRound==6) { currentFinaleQuestionIndex++; loadFinaleQuestion(); }
        }
        if (event.data.type === 'SHOW_ANSWERS') {
            if(currentRound==2) showPuzzleAnswers();
            if(currentRound==3) showOpenDeurAnswers();
            if(currentRound==4) showMemoryAnswers();
            if(currentRound==5) showBeeldAnswers();
            if(currentRound==6) { activeFinaleQuestions[currentFinaleQuestionIndex].keywords.forEach(k => k.found = true); checkFinaleAnswer(); }
        }
        if (event.data.type === 'ADJUST_TIME') {
            updateSeconds(activePlayerIndex, event.data.amount);
            showBonusFeedback(activePlayerIndex, event.data.amount);
        }
    };
    </script>
</body>
</html>
