<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Dashboard - FC De Kampioenen</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stijl.css">
    
    <style>
        :root { --panel-bg: rgba(15, 23, 42, 0.95); --border-col: rgba(255, 255, 255, 0.15); }
        body { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; background: var(--bg-dark); font-family: 'Open Sans', sans-serif; font-size: 14px; }
        #dashboard-header { height: 60px; background: var(--bg-card); border-bottom: 1px solid var(--border-col); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); flex-shrink: 0; z-index: 10; }
        h1 { display: block !important; margin: 0; font-size: 1.5em; text-align: left; width: auto; }
        .round-controls { display: flex; gap: 5px; }
        .round-controls button { margin: 0; padding: 5px 15px; font-size: 0.85em; height: 36px; }
        .round-controls button.active-round { background: var(--primary-accent); color: #000; box-shadow: 0 0 10px var(--primary-accent); border: 1px solid #fff; }
        .global-actions { margin-left: 20px; }
        .btn-fail { background: linear-gradient(135deg, #ef4444, #991b1b) !important; color: white !important; border: 1px solid #ffaaaa !important; font-weight: bold; }
        #dashboard-main { flex: 1; display: grid; grid-template-columns: 400px 1fr; gap: 0; overflow: hidden; }
        .panel { padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }
        .panel-left { background: rgba(0, 0, 0, 0.2); border-right: 1px solid var(--border-col); }
        .panel-right { background: transparent; padding: 0; display: flex; flex-direction: column; }
        h2 { font-size: 1.1em; margin-bottom: 10px; border-bottom: 1px solid var(--border-col); padding-bottom: 5px; color: var(--text-muted); text-transform: uppercase; }
        
        .search-strip { padding: 15px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border-col); display: flex; align-items: center; gap: 15px; flex-shrink: 0; }
        .search-strip input { margin: 0; width: 300px; padding: 8px 12px; font-size: 1em; opacity: 0.5; }
        #result-area { flex: 1; padding: 20px; overflow-y: auto; background: rgba(0,0,0,0.1); }
        .list-item { background: rgba(255,255,255,0.03); border: 1px solid var(--border-col); margin-bottom: 8px; padding: 10px 15px; border-radius: 4px; line-height: 1.5; }
        .list-item strong { color: var(--secondary-accent); }
        .answer-box { display: inline-block; background: rgba(34, 197, 94, 0.1); color: var(--correct-color); padding: 2px 8px; border-radius: 4px; cursor: pointer; border: 1px solid rgba(34, 197, 94, 0.3); margin: 0 2px; font-weight: 600; }
        .answer-box:hover { background: var(--correct-color); color: #000; }
        .clickable-keyword { display: inline-block; margin: 2px 5px 2px 0; padding: 2px 6px; border: 1px dashed var(--text-muted); border-radius: 3px; cursor: pointer; font-size: 0.9em; }
        .clickable-keyword:hover { border-color: var(--correct-color); color: var(--correct-color); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    
    <script src="quizdata_r1.js"></script>
    <script src="quizdata_r2.js"></script>
    <script src="quizdata_r3.js"></script>
    <script src="quizdata_r4.js"></script>
    <script src="quizdata_r5.js"></script>
    <script src="quizdata_r6.js"></script>
    <script src="quizdata_loader.js"></script>

    <div id="dashboard-header">
        <div style="display:flex; align-items:center;">
            <h1>GM Console</h1>
            <span style="margin-left: 15px; padding: 4px 8px; background: var(--primary-accent); color: black; border-radius: 4px; font-weight: bold; font-size: 0.8em;">F.C. De Kampioenen</span>
            <div class="global-actions">
                <button onclick="channel.postMessage({ type: 'TRIGGER_FAIL' })" class="btn-fail" title="Druk op Pas/Fout">❌ FOUT / PAS</button>
            </div>
        </div>

        <div class="round-controls controls">
            <button id="btn-round-1" class="active-round">R1</button>
            <button id="btn-round-2">R2</button>
            <button id="btn-round-3">R3</button>
            <button id="btn-round-4">R4</button>
            <button id="btn-round-5">R5 (Beeld)</button>
            <button id="btn-round-6">R6 (Finale)</button>
        </div>
    </div>
    
    <div id="dashboard-main">
        <div class="panel panel-left" style="display: flex; flex-direction: column;">
            <h2>👥 Live Spelers & Timers</h2>
            
            <!-- HIER KOMT DE LIVE DATA VAN HET GROTE SCHERM -->
            <div id="live-players-container" style="flex: 1; overflow-y: auto;">
                <p style="color: var(--text-muted); text-align: center; margin-top: 20px;">Wacht tot de spelers hun naam hebben ingevuld en het spel is gestart op het hoofdscherm...</p>
            </div>

            <!-- SPELLEIDER SECONDEN CONTROLES -->
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border-col); display: flex; flex-direction: column; gap: 8px;">
                <h3 style="margin: 0; font-size: 0.9em; color: var(--text-muted);">Tijd Toevoegen / Aftrekken:</h3>
                <button onclick="channel.postMessage({ type: 'ADJUST_TIME', amount: -20 })" style="background: var(--kamp-rood); margin: 0;">-20 Seconden (Fout)</button>
                <div style="display: flex; gap: 5px;">
                    <button onclick="channel.postMessage({ type: 'ADJUST_TIME', amount: 10 })" style="flex: 1; margin: 0; background: var(--kamp-groen);">+10 Sec</button>
                    <button onclick="channel.postMessage({ type: 'ADJUST_TIME', amount: 20 })" style="flex: 1; margin: 0; background: var(--kamp-groen);">+20 Sec</button>
                </div>
            </div>
        </div>

        <div class="panel panel-right">
            <div class="search-strip">
                <h3 id="input-label" style="margin:0; min-width: 100px; color: var(--primary-accent);">Actieve ID(s):</h3>
                <input type="text" id="question-id-input" placeholder="Wacht op hoofdscherm..." autocomplete="off" disabled>
            </div>
            
            <div style="padding: 15px; background: rgba(255,255,255,0.05); display: flex; gap: 10px; border-bottom: 1px solid var(--border-col);">
                <button onclick="channel.postMessage({ type: 'NEXT_QUESTION' })" style="background: var(--kamp-geel); color: #000; padding: 8px 15px; cursor: pointer; border-radius: 4px; border:none; font-weight:bold;">Volgende Vraag / Speler</button>
                <button onclick="channel.postMessage({ type: 'SHOW_ANSWERS' })" style="background: var(--kamp-rood); color: #fff; padding: 8px 15px; cursor: pointer; border-radius: 4px; border:none; font-weight:bold;">Toon Antwoorden</button>
            </div>

            <div id="result-area">
                <div style="text-align: center; color: var(--text-muted); margin-top: 50px;">
                    <p style="font-size: 1.2em;">Zodra een ronde start, verschijnen de antwoorden hier automatisch!</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const channel = new BroadcastChannel('trivial_time_channel');
        const resultArea = document.getElementById('result-area');
        const inputField = document.getElementById('question-id-input');
        const buttons = document.querySelectorAll('.round-controls button');
        let activeRound = 1;

        function sendAnswer(text) { channel.postMessage({ type: 'FILL_ANSWER', answer: text }); }
        function selectPlayer(index) { channel.postMessage({ type: 'SELECT_PLAYER', playerIndex: index }); }
        function toggleTimer(index) { channel.postMessage({ type: 'TOGGLE_TIMER', playerIndex: index }); }
        function escapeAnswer(str) { if (!str) return ''; return str.replace(/'/g, "\\'"); }

        // LUISTER NAAR HET HOOFDSCHERM
        channel.onmessage = (event) => {
            // 1. LIVE SPELERS OVERNEMEN
            if (event.data.type === 'SYNC_PLAYERS') {
                const container = document.getElementById('live-players-container');
                container.innerHTML = '';
                event.data.players.forEach(p => {
                    const color = p.isActive ? 'var(--kamp-geel)' : 'white';
                    const bg = p.isActive ? 'rgba(255,215,0,0.1)' : 'rgba(255,255,255,0.02)';
                    const border = p.isActive ? `1px solid var(--kamp-geel)` : `1px solid rgba(255,255,255,0.1)`;
                    
                    container.innerHTML += `
                        <div style="background: ${bg}; border: ${border}; padding: 10px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
                            <span style="color: ${color}; font-weight: bold; font-size: 1.1em; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                                ${p.isActive ? '👉 ' : ''}${p.name}
                            </span>
                            <span style="font-family: 'Chakra Petch', sans-serif; font-size: 1.8em; font-weight: bold; color: ${p.isRunning ? 'var(--kamp-rood)' : 'var(--kamp-geel)'};">
                                ${p.seconds}
                            </span>
                            <div style="display: flex; gap: 5px;">
                                <button onclick="selectPlayer(${p.index})" style="padding: 5px; margin: 0; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); font-size: 1em;" title="Selecteer Speler">👆</button>
                                <button onclick="toggleTimer(${p.index})" style="padding: 5px; margin: 0; background: rgba(255,255,255,0.1); border: 1px solid var(--kamp-geel); font-size: 1em;" title="Start/Stop Timer">⏱️</button>
                            </div>
                        </div>
                    `;
                });
            }

            // 2. AUTOMATISCHE ANTWOORDEN TONEN
            if (event.data.type === 'SYNC_QUESTION') {
                activeRound = event.data.round;
                buttons.forEach(btn => btn.classList.remove('active-round'));
                document.getElementById(`btn-round-${activeRound}`).classList.add('active-round');
                
                inputField.value = event.data.ids.join(', '); // Toon de ids enkel ter info
                lookupAnswers(event.data.ids);
            }
        };

        function lookupAnswers(ids) {
            if (!ids || ids.length === 0) return;
            const themeData = window.ThemeManager.getTheme("KAMPIOENEN");
            if (!themeData) { resultArea.innerHTML = `<p style="color: var(--wrong-color)">Themadatas 'KAMPIOENEN' niet gevonden.</p>`; return; }

            let pool;
            if (activeRound == 1) pool = themeData.ronde1_pool;
            else if (activeRound == 2) pool = themeData.ronde2_answer_pool;
            else if (activeRound == 3) pool = themeData.ronde3_openDeur;
            else if (activeRound == 4) pool = themeData.ronde4_geheugen;
            else if (activeRound == 5) pool = themeData.ronde5_beeld;
            else if (activeRound == 6) pool = themeData.ronde6_finale;

            if (!pool || pool.length === 0) { resultArea.innerHTML = `<p style="color: var(--wrong-color)">Geen data beschikbaar voor deze ronde.</p>`; return; }

            let html = `<ul style="list-style: none; padding: 0;">`;
            ids.forEach(id => {
                const q = pool.find(item => item.id === id) || pool[id - 1]; 
                if (q) {
                    html += `<li class="list-item"><strong style="color: var(--primary-accent); margin-right: 10px;">#${id}</strong> `;
                    
                    if (activeRound === 1) {
                        const safeAnswer = escapeAnswer(q.a);
                        html += `${q.q} <br><span style="color:#aaa;">→</span> <span class="answer-box" onclick="sendAnswer('${safeAnswer}')" title="Klik om in te vullen">${q.a}</span>`;
                    }
                    else if (activeRound === 2) {
                        const safeAnswer = escapeAnswer(q.answer);
                        html += `<strong style="color:#fff;">${q.answer}</strong> <span class="answer-box" onclick="sendAnswer('${safeAnswer}')">📋</span><br><span style="font-size:0.9em; color:#aaa;">Hints: ${q.clues.join(' - ')}</span>`;
                    }
                    else if (activeRound === 3) {
                        const keywordsHtml = q.keywords.map(k => { const word = k.word ? k.word : k; return `<span class="clickable-keyword" onclick="sendAnswer('${escapeAnswer(word)}')">${word}</span>`; }).join(' ');
                        html += `<strong>${q.subject}</strong><br><div style="margin-top:5px;">${keywordsHtml}</div>`;
                    }
                    else if (activeRound === 4) {
                        const safeAnswer = escapeAnswer(q.a);
                        html += `${q.q1} ... <span class="answer-box" onclick="sendAnswer('${safeAnswer}')">${q.a}</span>`;
                    }
                    else if (activeRound === 5) {
                        const safeS = escapeAnswer(q.vraag1_seizoen); const safeA = escapeAnswer(q.vraag2_aflevering); const safeZ = escapeAnswer(q.vraag3_zinEind);
                        const keywordsHtml = q.vraag4_keywords.map(k => `<span class="clickable-keyword" onclick="sendAnswer('${escapeAnswer(k)}')">${k}</span>`).join(' ');
                        html += `<strong>Fragment: </strong> ${q.videoBron}<br><span style="font-size:0.9em; color:#aaa;">Seizoen:</span> <span class="answer-box" onclick="sendAnswer('${safeS}')">${q.vraag1_seizoen}</span><br><span style="font-size:0.9em; color:#aaa;">Aflevering:</span> <span class="answer-box" onclick="sendAnswer('${safeA}')">${q.vraag2_aflevering}</span><br><span style="font-size:0.9em; color:#aaa;">Zin: "${q.vraag3_zinBegin}"</span> → <span class="answer-box" onclick="sendAnswer('${safeZ}')">${q.vraag3_zinEind}</span><br><span style="font-size:0.9em; color:#aaa;">Trefwoorden:</span> ${keywordsHtml}`;
                    }
                    else if (activeRound === 6) {
                        const keywordsHtml = q.keywords.map(k => { const word = k.word ? k.word : k; return `<span class="clickable-keyword" onclick="sendAnswer('${escapeAnswer(word)}')">${word}</span>`; }).join(' ');
                        html += `<strong>${q.subject}</strong><br><div style="margin-top:5px;">${keywordsHtml}</div>`;
                    }
                    html += `</li>`;
                }
            });
            html += `</ul>`;
            resultArea.innerHTML = html;
        }
    </script>
</body>
</html>
