<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Regiekamer - F.C. De Kampioenen</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stijl.css">
    <style>
        body { padding: 0; align-items: stretch; min-height: 100vh; }
        #header {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
            gap: 10px; padding: 12px 18px; background: rgba(3, 34, 18, 0.92); border-bottom: 2px solid var(--kamp-geel);
        }
        #header h1 { margin: 0; font-size: 1.4rem; text-align: left; }
        .round-bar { display: flex; flex-wrap: wrap; gap: 6px; }
        .round-bar button {
            padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255, 215, 0, 0.35);
            background: rgba(0, 155, 72, 0.25); color: #fff; font-weight: 700; cursor: pointer; font-family: 'Chakra Petch', sans-serif;
        }
        .round-bar button.active-round { background: var(--kamp-geel); color: #032212; border-color: #fff; }
        .header-reports { display: flex; gap: 8px; }
        .header-reports button {
            padding: 8px 12px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; font-family: 'Chakra Petch', sans-serif;
        }

        #main-grid {
            display: grid;
            grid-template-columns: 240px 1fr 400px;
            gap: 16px;
            padding: 16px;
            flex: 1;
        }
        @media (max-width: 1050px) { #main-grid { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 720px) { #main-grid { grid-template-columns: 1fr; } }

        .panel {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 14px;
            padding: 16px; display: flex; flex-direction: column;
        }
        .panel h2 { font-size: 1.05rem; margin: 0 0 12px 0; border-bottom: 1px solid rgba(255, 215, 0, 0.25); padding-bottom: 8px; color: var(--kamp-geel); }

        .sidebar-player {
            padding: 10px 12px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        #active-player-name { font-size: clamp(1.8rem, 3vw, 2.8rem); font-family: 'Chakra Petch', sans-serif; font-weight: 700; text-align: center; }
        #active-player-score { font-size: clamp(3.5rem, 6vw, 6rem); font-family: 'Chakra Petch', sans-serif; font-weight: 700; color: var(--kamp-geel); text-align: center; line-height: 1.05; margin-bottom: 14px; }

        .big-btn {
            width: 100%; padding: 15px; border-radius: 10px; border: none; font-size: 1.2rem; font-weight: 700;
            font-family: 'Chakra Petch', sans-serif; cursor: pointer; margin-bottom: 10px;
        }
        .row-btns { display: flex; gap: 8px; width: 100%; margin-bottom: 10px; }
        .row-btns button { flex: 1; padding: 11px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; font-family: 'Chakra Petch', sans-serif; }

        .correct-btn {
            background: var(--kamp-donkergroen); color: #fff; border: 2px solid var(--kamp-groen);
            padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; margin: 4px 4px 4px 0;
        }
        .correct-btn:hover { background: var(--kamp-geel); color: #032212; border-color: #fff; }
        .grid-select-btn {
            background: var(--kamp-groen); color: #fff; padding: 12px; border-radius: 8px; border: 2px solid var(--kamp-geel);
            cursor: pointer; font-weight: 700; flex: 1; min-width: 110px;
        }
        .grid-select-btn:hover { background: var(--kamp-geel); color: #032212; }
        .grid-select-btn:disabled { background: #1e293b; color: #64748b; border-color: #334155; cursor: not-allowed; }
    </style>
</head>
<body>
    <script src="quizdata_r1.js"></script>
    <script src="quizdata_r2.js"></script>
    <script src="quizdata_r3.js"></script>
    <script src="quizdata_r4.js"></script>
    <script src="quizdata_r5.js"></script>
    <script src="quizdata_r6.js"></script>
    <script src="quizdata_loader.js"></script>

    <div id="header">
        <h1>🎬 REGIEKAMER</h1>
        <div class="round-bar">
            <button data-round="1" onclick="startRoundDirect(1)">R1 Algemeen</button>
            <button data-round="2" onclick="startRoundDirect(2)">R2 Puzzel</button>
            <button data-round="3" onclick="startRoundDirect(3)">R3 Radio Hallo</button>
            <button data-round="4" onclick="startRoundDirect(4)">R4 Bordjes</button>
            <button data-round="5" onclick="startRoundDirect(5)">R5 Beeld</button>
            <button data-round="6" onclick="startRoundDirect(6)">R6 Finale</button>
        </div>
        <div class="header-reports">
            <button style="background:var(--kamp-groen); color:#fff;" onclick="channel.postMessage({ type: 'REQUEST_REPORT' })">📊 Scherm</button>
            <button style="background:var(--kamp-geel); color:#032212;" onclick="channel.postMessage({ type: 'DOWNLOAD_PDF_REPORT' })">📄 PDF Rapport</button>
        </div>
    </div>

    <div id="main-grid">
        <div class="panel">
            <h2>👥 Spelers</h2>
            <div id="live-players-container"><p style="color:var(--text-muted); text-align:center;">Start eerst de quiz op het grote scherm.</p></div>
        </div>

        <div class="panel" id="panel-center">
            <h2>⏱️ Klok & Beurt</h2>
            <div id="active-player-name">—</div>
            <div id="active-player-score">0</div>
            <button id="btn-massive-timer" class="big-btn" style="background:var(--kamp-geel); color:#032212;" onclick="channel.postMessage({ type: 'TOGGLE_TIMER' })">▶ START TIMER</button>
            <button class="big-btn" style="background:var(--kamp-rood); color:#fff;" onclick="channel.postMessage({ type: 'TRIGGER_FAIL' })">❌ FOUT / PAS</button>
            <div class="row-btns">
                <button style="background:#991b1b; color:#fff;" onclick="channel.postMessage({ type: 'ADJUST_TIME', amount: -20 })">-20s</button>
                <button style="background:var(--kamp-groen); color:#fff;" onclick="channel.postMessage({ type: 'ADJUST_TIME', amount: 10 })">+10s</button>
                <button style="background:var(--kamp-groen); color:#fff;" onclick="channel.postMessage({ type: 'ADJUST_TIME', amount: 20 })">+20s</button>
            </div>
        </div>

        <div class="panel">
            <h2>📝 Antwoorden & Verloop</h2>
            <div class="row-btns" id="flow-buttons">
                <button style="background:var(--kamp-geel); color:#032212;" onclick="channel.postMessage({ type: 'NEXT_QUESTION' })">▶ Volgende</button>
                <button style="background:var(--kamp-rood); color:#fff;" onclick="channel.postMessage({ type: 'SHOW_ANSWERS' })">👁️ Toon Alles</button>
            </div>
            <div id="result-area" style="overflow-y:auto; flex:1;">
                <p style="color:var(--text-muted); text-align:center; margin-top:20px;">Klik bovenaan op een ronde om direct te starten.</p>
            </div>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('trivial_time_channel');
        const resultArea = document.getElementById('result-area');
        let activeRound = 0, lastPlayers = [];

        function startRoundDirect(r) {
            if (activeRound !== 0 && activeRound !== r && !confirm(`Wil je overschakelen naar Ronde ${r}?`)) return;
            activeRound = r;
            document.querySelectorAll('.round-bar button').forEach(b => b.classList.toggle('active-round', parseInt(b.dataset.round) === r));
            channel.postMessage({ type: 'START_ROUND', round: r });
        }

        function esc(s) { return (s || '').replace(/'/g, "\\'"); }
        function sendAnswer(txt) { channel.postMessage({ type: 'FILL_ANSWER', answer: txt }); }
        function triggerVideo(i) {
            channel.postMessage({ type: 'SELECT_VIDEO', index: i });
            setTimeout(() => channel.postMessage({ type: 'PLAY_VIDEO' }), 250);
            resultArea.innerHTML = `<p style="text-align:center; color:var(--kamp-geel); margin-top:30px;">🎬 Video speelt af op groot scherm...</p>`;
        }

        channel.onmessage = (e) => {
            const d = e.data; if (!d) return;

            if (d.type === 'SYNC_PLAYERS') {
                lastPlayers = d.players;
                const c = document.getElementById('live-players-container');
                let activeP = null;
                c.innerHTML = d.players.map(p => {
                    if (p.isActive) activeP = p;
                    return `<div class="sidebar-player" style="background:${p.isActive ? 'rgba(255,215,0,0.2)' : 'rgba(0,25,12,0.45)'}; border:2px solid ${p.isActive ? 'var(--kamp-geel)' : 'transparent'};" onclick="channel.postMessage({ type: 'SELECT_PLAYER', playerIndex: ${p.index} })">
                        <strong>${p.isActive ? '👉 ' : ''}${p.hasPlayed ? '✔️ ' : ''}${p.name}</strong>
                        <span style="font-family:'Chakra Petch',sans-serif; font-size:1.3rem; color:${p.isRunning ? 'var(--kamp-rood)' : 'var(--kamp-geel)'};">${p.seconds}</span>
                    </div>`;
                }).join('');

                if (activeP) {
                    document.getElementById('active-player-name').textContent = activeP.name;
                    document.getElementById('active-player-score').textContent = activeP.seconds;
                    const btn = document.getElementById('btn-massive-timer');
                    btn.textContent = activeP.isRunning ? '❚❚ STOP TIMER' : '▶ START TIMER';
                    btn.style.background = activeP.isRunning ? 'var(--kamp-rood)' : 'var(--kamp-geel)';
                    btn.style.color = activeP.isRunning ? '#fff' : '#032212';
                }
            }

            if (d.type === 'SYNC_R3_GRID') {
                document.getElementById('flow-buttons').style.display = 'flex';
                let html = `<p style="color:var(--kamp-geel); font-weight:bold; margin:0 0 10px 0;">Speler kiest een Radio Hallo fragment:</p><div style="display:flex; gap:8px; flex-wrap:wrap;">`;
                for (let i = 0; i < d.total; i++) {
                    const done = d.played.includes(i);
                    html += `<button class="grid-select-btn" ${done ? 'disabled' : `onclick="channel.postMessage({ type: 'SELECT_AUDIO_R3', index: ${i} })"`}>${done ? '❌' : '📻'} Fragment ${i + 1}</button>`;
                }
                resultArea.innerHTML = html + `</div>`;
            }

            if (d.type === 'SYNC_R4') {
                document.getElementById('flow-buttons').style.display = 'none';
                resultArea.innerHTML = `
                    <div style="text-align:center;">
                        <h3 style="color:var(--kamp-geel); margin:0;">Foto ${d.qNum} / ${d.total}</h3>
                        <p style="font-size:1.25rem; color:var(--kamp-geel); font-weight:bold; margin:8px 0 14px 0;">${d.answer}</p>
                        <button class="big-btn" style="background:var(--kamp-groen); color:#fff;" onclick="channel.postMessage({ type: 'START_R4_TIMER' })">⏱️ START 15 SEC TIMER</button>
                        <div style="display:flex; flex-direction:column; gap:8px; margin:12px 0;">
                            ${lastPlayers.map(p => `<button style="padding:10px; border-radius:8px; border:none; background:var(--kamp-geel); color:#032212; font-weight:bold; cursor:pointer; text-align:left;" onclick="this.style.background='var(--kamp-groen)'; this.style.color='#fff'; this.textContent='✔️ ${p.name} (+40s)'; channel.postMessage({ type: 'ADJUST_TIME', amount: 40, targetPlayer: ${p.index} })">✅ Geef ${p.name} +40 sec</button>`).join('')}
                        </div>
                        <button class="big-btn" style="background:var(--kamp-donkergroen); color:#fff; border:1px solid var(--kamp-geel);" onclick="channel.postMessage({ type: 'NEXT_QUESTION' })">▶ VOLGENDE FOTO</button>
                    </div>`;
            }

            if (d.type === 'SYNC_R5_GRID') {
                document.getElementById('flow-buttons').style.display = 'flex';
                let html = `<div style="display:flex; gap:8px; flex-wrap:wrap;">`;
                for (let i = 0; i < d.total; i++) {
                    const done = d.played.includes(i);
                    html += `<button class="grid-select-btn" ${done ? 'disabled' : `onclick="triggerVideo(${i})"`}>${done ? '❌' : '▶'} Fragment ${i + 1}</button>`;
                }
                resultArea.innerHTML = html + `</div>`;
            }

            if (d.type === 'SYNC_QUESTION') {
                activeRound = d.round;
                document.getElementById('flow-buttons').style.display = 'flex';
                lookupAnswers(d.ids);
            }
        };

        function lookupAnswers(ids) {
            const data = window.ThemeManager.getTheme("KAMPIOENEN");
            if (!data) return;
            const pools = { 1: data.ronde1_pool, 2: data.ronde2_answer_pool, 3: data.ronde3_openDeur, 5: data.ronde5_beeld, 6: data.ronde6_finale };
            const pool = pools[activeRound] || [];

            resultArea.innerHTML = ids.map(id => {
                const q = pool.find(x => x.id === id) || pool[id - 1];
                if (!q) return '';
                if (activeRound === 1) return `<div style="margin-bottom:12px;"><p style="margin:0 0 8px 0;">${q.q}</p><button class="correct-btn" onclick="sendAnswer('${esc(q.a)}')">✅ ${q.a}</button></div>`;
                if (activeRound === 2) return `<div style="margin-bottom:10px; padding:10px; background:rgba(0,25,12,0.45); border-radius:8px;"><div style="font-size:0.85rem; color:var(--text-muted);">${q.clues.join(' • ')}</div><button class="correct-btn" onclick="sendAnswer('${esc(q.answer)}')">✅ ${q.answer}</button></div>`;
                if (activeRound === 3) return `<button class="big-btn" style="background:var(--kamp-groen); color:#fff;" onclick="channel.postMessage({ type: 'PLAY_AUDIO' })">📻 SPEEL RADIO HALLO</button><div>${q.keywords.map(k => `<button class="correct-btn" onclick="sendAnswer('${esc(k.word || k)}')">✅ ${k.word || k}</button>`).join('')}</div>`;
                if (activeRound === 5) return `<div style="display:flex; flex-direction:column; gap:6px;">
                    <button class="correct-btn" onclick="sendAnswer('${esc(q.vraag1_seizoen)}')">Seizoen: ${q.vraag1_seizoen}</button>
                    <button class="correct-btn" onclick="sendAnswer('${esc(q.vraag2_aflevering)}')">Aflevering: ${q.vraag2_aflevering}</button>
                    <button class="correct-btn" onclick="sendAnswer('${esc(q.vraag3_zinEind)}')">Zin: ${q.vraag3_zinEind}</button>
                    <div>${(q.vraag4_keywords || []).map(k => `<button class="correct-btn" onclick="sendAnswer('${esc(k)}')">✅ ${k}</button>`).join('')}</div>
                </div>`;
                if (activeRound === 6) return `<strong>${q.subject}</strong><div style="margin-top:8px;">${q.keywords.map(k => `<button class="correct-btn" onclick="sendAnswer('${esc(k.word || k)}')">✅ ${k.word || k}</button>`).join('')}</div>`;
                return '';
            }).join('');
        }
    </script>
</body>
</html>
