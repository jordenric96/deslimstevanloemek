<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Regiekamer - FC De Kampioenen</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stijl.css">
    
    <style>
        :root { --panel-bg: rgba(15, 23, 42, 0.95); --border-col: rgba(255, 255, 255, 0.15); }
        body { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; background: var(--bg-dark); font-family: 'Open Sans', sans-serif; font-size: 14px; }
        
        /* HEADER */
        #dashboard-header { height: 70px; background: rgba(0,0,0,0.6); border-bottom: 2px solid var(--kamp-geel); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; z-index: 10; }
        h1 { display: block !important; margin: 0; font-size: 1.8em; text-align: left; width: auto; color: var(--kamp-geel); }
        .round-controls { display: flex; gap: 8px; }
        .round-controls button { margin: 0; padding: 10px 20px; font-size: 1em; height: 45px; display: block !important; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        .round-controls button.active-round { background: var(--kamp-geel); color: #000; box-shadow: 0 0 15px rgba(255,215,0,0.5); border: 1px solid #fff; font-weight: bold; }
        
        /* 3-KOLOMMEN LAYOUT */
        #dashboard-main { flex: 1; display: grid; grid-template-columns: 280px 1fr 450px; gap: 20px; padding: 20px; overflow: hidden; }
        
        .panel { background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-col); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; overflow: hidden; }
        h2 { font-size: 1.2em; margin: 0 0 15px 0; border-bottom: 1px solid var(--border-col); padding-bottom: 10px; color: #fff; text-transform: uppercase; text-align: center; }

        /* LINKER KOLOM: Spelers */
        #live-players-container { flex: 1; overflow-y: auto; padding-right: 5px; }
        .sidebar-player { padding: 12px 15px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .sidebar-player:hover { filter: brightness(1.2); }
        
        /* MIDDEN KOLOM: Actieve Speler Control */
        #panel-center { background: rgba(11, 128, 67, 0.15); border: 3px solid var(--kamp-geel); align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(255, 215, 0, 0.1); transition: 0.3s; }
        #ap-name { font-size: 3.5em; font-family: 'Chakra Petch', sans-serif; margin: 0 0 10px 0; color: #fff; text-align: center; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        #ap-score { font-family: 'Chakra Petch', sans-serif; font-size: 8em; font-weight: bold; color: var(--kamp-geel); text-shadow: 0 5px 20px rgba(0,0,0,0.8); line-height: 1; margin-bottom: 30px; }
        
        .massive-btn { width: 85%; font-size: 1.8em; padding: 25px; border-radius: 12px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.2s; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.4); margin-bottom: 15px; }
        .massive-btn:active { transform: scale(0.98); }
        
        .time-adjust-row { display: flex; gap: 15px; width: 85%; margin-top: 10px; }
        .time-adjust-row button { flex: 1; padding: 15px; font-size: 1.2em; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: 0.2s; }
        .time-adjust-row button:active { transform: scale(0.95); }

        /* RECHTER KOLOM: Antwoorden & Spelverloop */
        .game-flow-actions { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-col); }
        .game-flow-actions button { padding: 15px; font-size: 1.2em; border-radius: 8px; margin: 0; }
        .game-flow-row { display: flex; gap: 10px; }
        .game-flow-row button { flex: 1; }

        #result-area { flex: 1; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .list-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,215,0,0.3); margin-bottom: 10px; padding: 15px; border-radius: 8px; line-height: 1.5; font-size: 1.1em; }
        .list-item strong { color: var(--kamp-geel); }
        
        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
    </style>
</head>
<body>
    
    <script src="quizdata_r1.js"></script>
    <script src="quizdata_r2.js"></script>
    <script src="quizdata_r3.js"></script>
    <script src="quizdata_r4.js"></script>
    <script src="quizdata_r5.js"></script>
    <script src="quizdata_r6.js"></script>
    <script src="quizdata_loader.js"></script>

    <div id="dashboard-header">
        <div style="display:flex; align-items:center;">
            <h1>GM REGIEKAMER</h1>
            <span style="margin-left: 15px; padding: 6px 12px; background: var(--kamp-groen); color: white; border-radius: 6px; font-weight: bold; font-size: 0.9em; letter-spacing: 1px;">F.C. De Kampioenen</span>
        </div>

        <div class="round-controls">
            <button id="btn-round-1" data-round="1" class="active-round">R1</button>
            <button id="btn-round-2" data-round="2">R2 (Puzzel)</button>
            <button id="btn-round-3" data-round="3">R3 (Open Deur)</button>
            <button id="btn-round-4" data-round="4">R4 (Geheugen)</button>
            <button id="btn-round-5" data-round="5">R5 (Beeld)</button>
            <button id="btn-round-6" data-round="6">R6 (Finale)</button>
        </div>
    </div>
    
    <div id="dashboard-main">
        
        <!-- LINKS: Alle Spelers (Overzicht) -->
        <div class="panel">
            <h2>👥 Overzicht Spelers</h2>
            <p style="font-size: 0.85em; color: var(--text-muted); text-align: center; margin-top: -10px; margin-bottom: 15px;">Klik op een speler om handmatig de beurt te geven.</p>
            <div id="live-players-container">
                <p style="color: var(--text-muted); text-align: center; margin-top: 50px;">Wacht tot het spel gestart is op het Grote Scherm...</p>
            </div>
        </div>

        <!-- MIDDEN: Actieve Speler (De Grote Knoppen) -->
        <div class="panel" id="panel-center">
            <h2 style="border: none; color: var(--kamp-groen); font-weight: bold; margin-bottom: 5px;">🎯 Actieve Speler</h2>
            
            <div id="active-player-name" id="ap-name">Niemand</div>
            <div id="active-player-score" id="ap-score">0</div>
            
            <button id="btn-massive-timer" class="massive-btn" style="background: var(--kamp-geel); color: #000;" onclick="toggleTimer(activePlayerIndex)">
                ▶ START TIMER
            </button>
            
            <button class="massive-btn" style="background: var(--kamp-rood); color: #fff; font-size: 1.4em;" onclick="channel.postMessage({ type: 'TRIGGER_FAIL' })">
                ❌ FOUT / PAS (Volgende)
            </button>

            <div class="time-adjust-row">
                <button style="background: var(--kamp-rood); color: #fff;" onclick="channel.postMessage({ type: 'ADJUST_TIME', amount: -20 })">-20 SEC</button>
                <button style="background: var(--kamp-groen); color: #fff;" onclick="channel.postMessage({ type: 'ADJUST_TIME', amount: 10 })">+10 SEC</button>
                <button style="background: var(--kamp-groen); color: #fff;" onclick="channel.postMessage({ type: 'ADJUST_TIME', amount: 20 })">+20 SEC</button>
            </div>
        </div>

        <!-- RECHTS: Spelverloop & Antwoorden -->
        <div class="panel">
            <h2>📝 Spelverloop & Antwoorden</h2>
            
            <div class="game-flow-actions">
                <button onclick="channel.postMessage({ type: 'START_ROUND', round: activeRound })" style="background: var(--kamp-groen); color: #fff; font-weight: bold;">
                    ▶ START GESELECTEERDE RONDE
                </button>
                <div class="game-flow-row">
                    <button onclick="channel.postMessage({ type: 'NEXT_QUESTION' })" style="background: var(--kamp-geel); color: #000; font-weight: bold;">Volgende Vraag</button>
                    <button onclick="channel.postMessage({ type: 'SHOW_ANSWERS' })" style="background: var(--kamp-rood); color: #fff; font-weight: bold;">Toon Antwoord</button>
                </div>
            </div>

            <div id="result-area">
                <div style="text-align: center; color: var(--text-muted); margin-top: 50px;">
                    <p style="font-size: 1.2em;">Zodra een ronde start, verschijnen de antwoorden hier automatisch!</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const channel = new BroadcastChannel('trivial_time_channel');
        const resultArea = document.getElementById('result-area');
        const buttons = document.querySelectorAll('.round-controls button');
        
        let activeRound = 1;
        let activePlayerIndex = 0; // Wordt live overschreven door het hoofdscherm

        // Helper Functies
        function selectPlayer(index) { channel.postMessage({ type: 'SELECT_PLAYER', playerIndex: index }); }
        function toggleTimer(index) { channel.postMessage({ type: 'TOGGLE_TIMER', playerIndex: index }); }
        function escapeAnswer(str) { if (!str) return ''; return str.replace(/'/g, "\\'"); }

        // Ronde Selectie (Bovenaan)
        buttons.forEach(button => { 
            button.addEventListener('click', () => { 
                buttons.forEach(btn => btn.classList.remove('active-round'));
                button.classList.add('active-round');
                activeRound = parseInt(button.dataset.round);
            }); 
        });

        // LUISTER NAAR HET HOOFDSCHERM
        channel.onmessage = (event) => {
            
            // 1. LIVE SPELERS UPDATE
            if (event.data.type === 'SYNC_PLAYERS') {
                const container = document.getElementById('live-players-container');
                container.innerHTML = '';
                
                let activePlayerFound = null;

                event.data.players.forEach(p => {
                    // Update Active Player variabele
                    if (p.isActive) {
                        activePlayerFound = p;
                        activePlayerIndex = p.index;
                    }

                    // Bouw zijbalk
                    const bgColor = p.isActive ? 'rgba(255,215,0,0.15)' : 'rgba(255,255,255,0.05)';
                    const borderStyle = p.isActive ? `2px solid var(--kamp-geel)` : `2px solid transparent`;
                    const textColor = p.isActive ? 'var(--kamp-geel)' : '#fff';
                    const scoreColor = p.isRunning ? 'var(--kamp-rood)' : 'var(--kamp-geel)';

                    container.innerHTML += `
                        <div class="sidebar-player" style="background: ${bgColor}; border: ${borderStyle};" onclick="selectPlayer(${p.index})">
                            <span style="font-weight: bold; font-size: 1.1em; color: ${textColor}; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                                ${p.isActive ? '👉 ' : ''}${p.name}
                            </span>
                            <span style="font-family: 'Chakra Petch', sans-serif; font-size: 1.5em; font-weight: bold; color: ${scoreColor};">
                                ${p.seconds}
                            </span>
                        </div>
                    `;
                });

                // Update Centrale Grote Blok
                if (activePlayerFound) {
                    document.getElementById('active-player-name').textContent = activePlayerFound.name;
                    document.getElementById('active-player-score').textContent = activePlayerFound.seconds;
                    
                    const btnTimer = document.getElementById('btn-massive-timer');
                    const centerPanel = document.getElementById('panel-center');

                    if (activePlayerFound.isRunning) {
                        btnTimer.textContent = '❚❚ STOP TIMER';
                        btnTimer.style.background = 'var(--kamp-rood)';
                        btnTimer.style.color = '#fff';
                        centerPanel.style.borderColor = 'var(--kamp-rood)';
                        centerPanel.style.background = 'rgba(217, 37, 37, 0.1)';
                        centerPanel.style.boxShadow = '0 0 40px rgba(217, 37, 37, 0.2)';
                        document.getElementById('active-player-score').style.color = 'var(--kamp-rood)';
                    } else {
                        btnTimer.textContent = '▶ START TIMER';
                        btnTimer.style.background = 'var(--kamp-geel)';
                        btnTimer.style.color = '#000';
                        centerPanel.style.borderColor = 'var(--kamp-geel)';
                        centerPanel.style.background = 'rgba(11, 128, 67, 0.15)';
                        centerPanel.style.boxShadow = '0 0 30px rgba(255, 215, 0, 0.1)';
                        document.getElementById('active-player-score').style.color = 'var(--kamp-geel)';
                    }
                }
            }

            // 2. AUTOMATISCHE ANTWOORDEN TONEN
            if (event.data.type === 'SYNC_QUESTION') {
                activeRound = event.data.round;
                buttons.forEach(btn => btn.classList.remove('active-round'));
                document.getElementById(`btn-round-${activeRound}`).classList.add('active-round');
                
                lookupAnswers(event.data.ids);
            }
        };

        // ANTWOORDEN OPHALEN
        function lookupAnswers(ids) {
            if (!ids || ids.length === 0) return;
            const themeData = window.ThemeManager.getTheme("KAMPIOENEN");
            if (!themeData) { resultArea.innerHTML = `<p style="color: var(--wrong-color)">Themadatas 'KAMPIOENEN' niet gevonden.</p>`; return; }

            let pool;
            if (activeRound == 1) pool = themeData.ronde1_pool;
            else if (activeRound == 2) pool = themeData.ronde2_answer_pool;
            else if (activeRound == 3) pool = themeData.ronde3_openDeur;
            else if (activeRound == 4) pool = themeData.ronde4_geheugen;
            else if (activeRound == 5) pool = themeData.ronde5_beeld;
            else if (activeRound == 6) pool = themeData.ronde6_finale;

            if (!pool || pool.length === 0) { resultArea.innerHTML = `<p style="color: var(--wrong-color)">Geen data beschikbaar voor deze ronde.</p>`; return; }

            let html = `<ul style="list-style: none; padding: 0; margin: 0;">`;
            ids.forEach(id => {
                const q = pool.find(item => item.id === id) || pool[id - 1]; 
                if (q) {
                    html += `<li class="list-item"><strong style="color: var(--kamp-geel); margin-right: 10px;">ID #${id}</strong><br>`;
                    
                    if (activeRound === 1) {
                        html += `${q.q} <br><br><span style="color:#aaa;">Antwoord:</span> <strong style="color: var(--correct-color); font-size: 1.2em;">${q.a}</strong>`;
                    }
                    else if (activeRound === 2) {
                        html += `Puzzelwoord: <strong style="color:var(--correct-color); font-size: 1.2em;">${q.answer}</strong><br><span style="font-size:0.9em; color:#aaa;">Hints: ${q.clues.join(' - ')}</span>`;
                    }
                    else if (activeRound === 3) {
                        const keywordsHtml = q.keywords.map(k => { const word = k.word ? k.word : k; return `<span style="display:inline-block; border:1px solid #aaa; padding:2px 8px; margin:2px; border-radius:4px; color:var(--correct-color); font-weight:bold;">${word}</span>`; }).join(' ');
                        html += `<strong style="font-size:1.1em; color:#fff;">${q.subject}</strong><br><div style="margin-top:8px;">${keywordsHtml}</div>`;
                    }
                    else if (activeRound === 4) {
                        html += `${q.q1} ... <strong style="color:var(--correct-color); font-size: 1.2em;">${q.a}</strong>`;
                    }
                    else if (activeRound === 5) {
                        const keywordsHtml = q.vraag4_keywords.map(k => `<span style="color:var(--correct-color); font-weight:bold;">${k}</span>`).join(' & ');
                        html += `<strong style="color:#fff;">Beeldfragment (Antwoorden):</strong><br>
                                 <span style="color:#aaa;">Seizoen:</span> <span style="color:var(--correct-color); font-weight:bold;">${q.vraag1_seizoen}</span><br>
                                 <span style="color:#aaa;">Aflevering:</span> <span style="color:var(--correct-color); font-weight:bold;">${q.vraag2_aflevering}</span><br>
                                 <span style="color:#aaa;">Zin: "${q.vraag3_zinBegin}"</span> → <span style="color:var(--correct-color); font-weight:bold; font-size: 1.1em;">${q.vraag3_zinEind}</span><br>
                                 <span style="color:#aaa;">Trefwoorden:</span> ${keywordsHtml}`;
                    }
                    else if (activeRound === 6) {
                        const keywordsHtml = q.keywords.map(k => { const word = k.word ? k.word : k; return `<span style="display:inline-block; border:1px solid #aaa; padding:2px 8px; margin:2px; border-radius:4px; color:var(--correct-color); font-weight:bold;">${word}</span>`; }).join(' ');
                        html += `<strong style="font-size:1.1em; color:#fff;">${q.subject}</strong><br><div style="margin-top:8px;">${keywordsHtml}</div>`;
                    }
                    html += `</li>`;
                }
            });
            html += `</ul>`;
            resultArea.innerHTML = html;
        }
    </script>
</body>
</html>
